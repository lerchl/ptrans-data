name: Build ARM64 container image

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-arm-container:
    runs-on: ubuntu-22.04-arm

    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Get version from Cargo.toml
        id: cargo_version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build container image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/ptrans-data:${{ env.VERSION }} -f Containerfile .

      - name: Tag container image as latest
        run: |
          docker tag ghcr.io/${{ github.repository_owner }}/ptrans-data:${{ env.VERSION }} ghcr.io/${{ github.repository_owner }}/ptrans-data:latest

      - name: Push container images
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/ptrans-data:${{ env.VERSION }}
          docker push ghcr.io/${{ github.repository_owner }}/ptrans-data:latest
